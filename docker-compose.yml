services:
  db:
    image: postgres:16-alpine
    container_name: private-contact-crm-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: private_contact_crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm_password
    ports:
      - "5432:5432"
    volumes:
      - crm_pgdata:/var/lib/postgresql/data
  app:
    build: .
    container_name: private-contact-crm-app
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PORT: 3000
      DATABASE_URL: postgres://crm:crm_password@db:5432/private_contact_crm
      JWT_SECRET: change-this-in-production
    ports:
      - "3000:3000"
volumes:
  crm_pgdata:
